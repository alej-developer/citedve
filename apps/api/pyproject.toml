[project]
name = "radar-api"
version = "0.1.0"
description = "API de consulta de Radar Venezuela (FastAPI + Pydantic v2)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.0",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar_api"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
